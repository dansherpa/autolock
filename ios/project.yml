name: Autolock
options:
  bundleIdPrefix: com.sendprobe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Autolock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Autolock
    info:
      path: Autolock/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Walkaway Lock
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sendprobe.autolock
        PRODUCT_NAME: Autolock
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AutolockTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutolockTests
    dependencies:
      - target: Autolock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sendprobe.autolock.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Autolock.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Autolock"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Autolock:
    build:
      targets:
        Autolock:
          - running
          - testing
          - profiling
          - analyzing
          - archiving
        AutolockTests:
          - testing
    test:
      targets:
        - AutolockTests
